name: CI

# Debug build for every pull request and every branch push except main
# (main is built, signed and released by release.yml)
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/zygisk-detach-app-debug-${sha::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-detach-app-debug
          path: out/*.apk
          retention-days: 14
